name: Android CI
on:
  push:
    branches: [coloros17]
  pull_request:
    branches: [coloros17]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNINGKEYBASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          VERSION_NAME=$(grep -Eo 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Signing secrets are missing; uploading the unsigned APK instead"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "app/build/outputs/apk/release/ffc-hyperos4-$VERSION_NAME.apk"
            exit 0
          fi
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "app/build/outputs/apk/release/ffc-hyperos4-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "app/build/outputs/apk/release/ffc-hyperos4-$VERSION_NAME.apk" | head -2
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ffc-hyperos4-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/ffc-hyperos4-${{ env.VERSION_NAME }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "ffc HyperOS 4 ${{ env.VERSION_NAME }}"
          tag_name: ${{ env.VERSION_NAME }}-${{ github.run_number }}
          files: app/build/outputs/apk/release/ffc-hyperos4-${{ env.VERSION_NAME }}.apk
